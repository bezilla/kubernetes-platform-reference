# Everything `make check` runs, plus the two things it cannot: a real bring-up on
# a real cluster, and a look at what this repository would ship.
#
# Actions are pinned by commit SHA, not by tag. versions.env argues that a tag is
# a name and a digest is a fact, and pins the kind node image accordingly; a tag
# here would be the same mutable reference the rest of the repository refuses.
# The tag is kept in a trailing comment so the pin stays readable.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read at the top, and restated on every job below. The top-level default alone
# would be enough today; restating it means a job added later inherits nothing by
# accident, and any job that ever needs more has to say so on its own line where
# a reviewer will see it. No job here needs more than read -- artifact upload
# goes through the Actions API, not contents.
permissions:
  contents: read

jobs:
  lint:
    name: chart · manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          # Verified against both 3.19 and 4.2: the chart renders identically
          # under each, modulo blank lines, and values.schema.json is enforced
          # by both. CI pins the 3.x line because that is what most clusters
          # still run.
          version: v3.19.0
      - name: install kubeconform
        run: |
          version=0.8.0
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${version}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: prove recipes run with errexit and pipefail
        # Guards the make 3.81 trap: .SHELLFLAGS is silently ignored there, so a
        # failing step in a recipe can report success. Cheap, and it fails loudly.
        run: make shell-check
      - name: helm lint, render, schema and manifest validation
        run: make lint
      - name: every environment renders, validates and passes the guardrails
        # Three environments times two tenants, plus an assertion that the three
        # actually differ -- an environment layer that renders identically
        # everywhere is decoration, and would otherwise pass silently.
        run: make check-environments
      - name: versions.env agrees with every Application manifest
        # The Application manifests cannot source a shell file, so each carries
        # its chart version literally. This is the check that keeps that
        # duplication from drifting.
        run: make check-versions

  policy:
    name: guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: install the kyverno CLI
        run: |
          # Pinned to the version the suite was verified against. The CLI's
          # Value/variables file format has changed between minor releases, and
          # a mismatch shows up as every rule silently "Excluded" rather than as
          # an error.
          version=1.19.0
          curl -fsSL "https://github.com/kyverno/kyverno/releases/download/v${version}/kyverno-cli_v${version}_linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin kyverno
          kyverno version
      - name: every policy, both directions
        # Asserts that violations fail AND that compliant resources pass. A
        # policy matching everything and a policy matching nothing both look
        # correct if only one direction is checked, and matching-everything is
        # the bug this repository actually shipped once.
        run: make policy-test

  identity:
    name: identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The gate checks every commit, so it needs every commit. With the
          # default shallow clone it would check one and report success.
          fetch-depth: 0
      - name: install gitleaks
        run: |
          version=8.24.0
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: identity, trailers and secrets over all history
        # The same file the pre-push hook runs, in its --all-history mode. The
        # hook is per-clone configuration and does not travel with a clone, so
        # this is the copy nobody can forget to install.
        run: ./.githooks/pre-push --all-history
      - name: prove the gate rejects and accepts what it claims
        run: ./.githooks/selftest.sh

  cluster:
    # The whole platform, brought up on three Kubernetes versions. versions.env
    # says the charts support up to 1.34; running only 1.34 makes that half a
    # claim. fail-fast is off because "1.32 broke and 1.33 was cancelled" is
    # strictly less useful than knowing about both.
    #
    # THE SIBLING WORKLOAD REPOSITORY IS NOT CHECKED OUT HERE, deliberately.
    # ../otel-service-reference is absent on the runner, so sample-image.sh takes
    # its fallback branch and builds bootstrap/fallback-workload. That is the
    # path a stranger cloning this repository takes, so it is the path CI has to
    # prove -- and on it the placeholder speaks no OTLP, so demo-telemetry
    # reports zero spans and says which of its two reasons that is.
    name: fallback path · bring-up · demo · k8s ${{ matrix.k8s.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A backstop only. The real ceiling is derived from versions.env inside the
    # step below, so the bound the platform declares for itself is the bound that
    # fires, and it fires with the platform's own message rather than a silent
    # workflow kill. This number is deliberately larger than that.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - version: "1.32"
            image: "kindest/node:v1.32.11@sha256:5fc52d52a7b9574015299724bd68f183702956aa4a2116ae75a63cb574b35af8"
          - version: "1.33"
            image: "kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4"
          - version: "1.34"
            image: "kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # scripts/publish.sh pushes this working copy into the in-cluster
          # Git server, and git refuses to push shallow history into another
          # repository: "shallow update not allowed". actions/checkout defaults
          # to fetch-depth: 1, so every bring-up here died at the publish step
          # with the platform half-installed. Same reason the upgrade job sets
          # it -- that one needs a real repository to build a commit with
          # plumbing, this one needs one to push at all.
          fetch-depth: 0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0

      # Creates the cluster from this repository's own kind config, so the two
      # host port mappings the edge needs exist. up.sh finds it already present
      # and reuses it -- that branch is in up.sh precisely so a cluster somebody
      # else created is not silently recreated.
      - name: create the kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: cluster/kind.yaml
          cluster_name: platform
          node_image: ${{ matrix.k8s.image }}

      - name: what the runner is offering, against what versions.env demands
        # up.sh refuses on CPU, memory and Docker's image store, and each refusal
        # names the setting. Printing the inputs first means a preflight failure
        # reads as a fact about the runner rather than a mystery.
        #
        # Known and not papered over: MIN_CPUS is 4 and a standard runner has 4,
        # so the margin is ZERO -- a runner one core smaller would be refused
        # rather than slow. RECOMMENDED_CPUS is 8 and will never be met here, so
        # up.sh prints its under-recommended notice on every single run. That
        # notice is correct and versions.env is not being edited to silence it.
        run: |
          source versions.env
          docker system info --format \
            'NCPU={{.NCPU}}  MemTotal={{.MemTotal}}  Driver={{.Driver}}'
          echo "MemTotal MiB : $(( $(docker system info --format '{{.MemTotal}}') / 1048576 ))"
          echo "node image   : ${{ matrix.k8s.image }}"
          echo "MIN_CPUS     : ${MIN_CPUS}   RECOMMENDED_CPUS: ${RECOMMENDED_CPUS}"
          echo "MIN_MEMORY   : ${MIN_MEMORY_MIB} MiB   RECOMMENDED: ${RECOMMENDED_MEMORY_MIB} MiB"
          echo "cpu margin   : $(( $(docker system info --format '{{.NCPU}}') - MIN_CPUS )) core(s) over MIN_CPUS"

      # make init fails closed when gitleaks is missing -- the pre-push gate does
      # not skip, so neither does its installer. That is the correct behaviour
      # and it means this job has to install gitleaks even though it never
      # pushes anything. Version from versions.env, like every other tool here.
      - name: install gitleaks, which make init requires
        run: |
          source versions.env
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${CI_GITLEAKS_VERSION}/gitleaks_${CI_GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: make init
        run: make init

      - name: make up -- ceiling derived from versions.env
        # The ceiling is APP_TIMEOUT_SECONDS + UP_TIMEOUT_SECONDS plus ten
        # minutes of slack for the cluster, Argo CD and the two image builds.
        # up.sh is sequential and fail-closed: it stops at the FIRST component to
        # blow its per-component deadline, so the longest it can run before
        # failing is the components that succeed, plus one that hangs to
        # APP_TIMEOUT, plus a convergence wait that hangs to UP_TIMEOUT. This
        # bound follows from the file rather than from a guess about runners, and
        # if it is ever hit the answer is to find out why, not to raise it.
        run: |
          source versions.env
          ceiling=$(( APP_TIMEOUT_SECONDS + UP_TIMEOUT_SECONDS + 600 ))
          echo "ceiling: ${ceiling}s (APP_TIMEOUT ${APP_TIMEOUT_SECONDS} + UP_TIMEOUT ${UP_TIMEOUT_SECONDS} + 600 slack)"
          mkdir -p .ci-artifacts
          timeout --signal=INT "$ceiling" make up 2>&1 | tee .ci-artifacts/make-up.log
          exit "${PIPESTATUS[0]}"

      - name: git identity for the scratch commit
        # commit-tree needs an author. The ref is deleted on exit and never
        # published anywhere but the in-cluster mirror.
        #
        # Here for the same reason the upgrade job has it: `make demo` runs
        # demo-gitops, which builds its commit with git plumbing, and a runner
        # has no identity configured. Without this the leg reached demo-gitops
        # and died on "fatal: empty ident name ... not allowed", exit 128.
        run: |
          git config user.name  "Paul Bezilla"
          git config user.email "bezilla@protonmail.com"
      - name: make demo
        run: |
          source versions.env
          timeout --signal=INT "$(( UP_TIMEOUT_SECONDS + 600 ))" \
            make demo 2>&1 | tee .ci-artifacts/make-demo.log
          exit "${PIPESTATUS[0]}"

      - name: collect the applications table and the timings
        if: always()
        run: |
          mkdir -p .ci-artifacts
          kubectl -n argocd get applications > .ci-artifacts/applications.txt 2>&1 || true
          kubectl -n kube-system get pods \
            -o custom-columns='NAME:.metadata.name,RESTARTS:.status.containerStatuses[0].restartCount' \
            > .ci-artifacts/control-plane-restarts.txt 2>&1 || true
          grep -E 'is Ready \([0-9]+s\)|converged in' .ci-artifacts/make-up.log \
            | sed 's/^ *//' > .ci-artifacts/timings.txt 2>/dev/null || true
          {
            echo '### Applications'
            echo '```'; cat .ci-artifacts/applications.txt; echo '```'
            echo '### Per-component timings'
            echo '```'; cat .ci-artifacts/timings.txt; echo '```'
            echo '### Control plane restarts'
            echo '```'; cat .ci-artifacts/control-plane-restarts.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bring-up-k8s-${{ matrix.k8s.version }}
          path: .ci-artifacts/
          # .ci-artifacts is a hidden path, and upload-artifact@v4 defaults
          # include-hidden-files to false -- its glob skips dot-directories
          # outright. The files were always written and always there; the action
          # declined to look, and said "No files were found with the provided
          # path" on a green job. The sbom upload in the supply chain job uses
          # this same action and needs no flag, because sbom/ is not hidden.
          include-hidden-files: true
          retention-days: 30

      - name: diagnostics if it did not converge
        if: failure()
        run: |
          kubectl -n argocd get applications -o wide || true
          kubectl get pods -A || true
          kubectl -n kube-system get pods || true
          for app in $(kubectl -n argocd get applications -o name 2>/dev/null); do
            echo "--- $app ---"
            kubectl -n argocd get "$app" \
              -o jsonpath='{.status.conditions[*].message}{"\n"}' || true
          done

  upgrade:
    # The other cluster job builds from nothing, which proves the platform can be
    # created. This proves it can be moved -- which is what every dependency bump
    # actually asks for, and where CRD migrations and webhook downtime
    # show up. One version only: the upgrade path is orthogonal to the Kubernetes
    # version, and three of these would cost half an hour to learn the same thing.
    name: upgrade in place
    runs-on: ubuntu-latest
    # The rollback phase reads pin-delta's storage verdict before it re-points,
    # so this job now waits on that one; they ran in parallel before. pin-delta
    # takes about twenty-five seconds against this job's ten minutes, so the
    # serialisation costs about that -- and only moves the total run when this
    # job is the longest, which it has not always been.
    needs: pin-delta
    permissions:
      contents: read
    # The run step derives a 4860s (81m) ceiling from versions.env. This has to
    # stay strictly ABOVE it, which is the whole point: `timeout` interrupts the
    # script, which cleans up and says where it stopped, whereas GitHub killing
    # the job first produces no diagnosis at all. At 35 this sat exactly on the
    # old worst case, so the two could only ever fire together.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # upgrade-test.sh builds a commit with git plumbing, so it needs a
          # real repository rather than a shallow one.
          fetch-depth: 0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      # Same treatment the bring-up job gets. The previous curl install wrote to
      # /usr/local/bin and then failed on `chmod: Operation not permitted`,
      # because the runner image already carries a root-owned kind there. The
      # action does not fight the image for that path.
      #
      # upgrade-test.sh calls `make up` itself, which creates its own cluster --
      # so this one is created and immediately torn down. It is here for the kind
      # BINARY, which up.sh needs on PATH, and the cluster is the action's own
      # unavoidable side effect.
      - name: install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: upgrade-test-bootstrap
      - name: remove the bootstrap cluster, so make up builds its own
        run: kind delete cluster --name upgrade-test-bootstrap

      - name: fetch the storage verdict from the pin-delta job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pin-delta
          path: .pin-delta-artifact

      - name: git identity for the scratch commit
        # commit-tree needs an author. The ref is deleted on exit and never
        # published anywhere but the in-cluster mirror.
        run: |
          git config user.name  "Paul Bezilla"
          git config user.email "bezilla@protonmail.com"
      - name: install the previous versions, then upgrade to the pinned ones
        # The ceiling is derived from versions.env, the way the bring-up job's
        # is, rather than written as a number that has to be remembered.
        # upgrade-test.sh is sequential and every stage is bounded. It now runs
        # three phases, and the upgrade and rollback phases have the same four
        # bounded stages each: the published-revision check (180s), the
        # spec-propagation gate (300s), the convergence wait (UP_TIMEOUT), and
        # the installed-state assertion (300s). Plus one `make up` at the front,
        # also UP_TIMEOUT.
        #
        # 900 + (180+300+900+300) + (180+300+900+300) = 4260s, and ten minutes of
        # slack for the cluster, Argo CD and the two image builds gives 4860s.
        # The previous formula also under-counted: it predated the
        # published-revision check and never included its 180s.
        #
        # For scale, the whole thing takes about eleven minutes in practice. This
        # is a bound on the pathological case where every wait runs to its
        # deadline, not a budget -- and if it is ever hit the answer is to find
        # out why, not to raise it.
        #
        # `--signal=INT` rather than the default TERM: upgrade-test.sh and up.sh
        # both trap INT, so an interrupted run cleans up its scratch ref and
        # prints where it stopped. Being killed outright leaves neither.
        run: |
          # shellcheck disable=SC1091
          source versions.env
          phase=$(( 180 + 300 + UP_TIMEOUT_SECONDS + 300 ))
          ceiling=$(( UP_TIMEOUT_SECONDS + phase + phase + 600 ))
          echo "ceiling: ${ceiling}s (make up ${UP_TIMEOUT_SECONDS} + 2 x ${phase} upgrade/rollback + 600 slack)"
          # Where the leg looks for the verdict. If the download produced
          # nothing the file is absent, storage-verdict.sh reports
          # `unavailable`, and the leg rolls back anyway but refuses to classify
          # a failure. That is the designed behaviour, not a fallback that hides
          # a problem.
          export STORAGE_VERDICT_FILE=.pin-delta-artifact/storage-verdict.txt
          timeout --signal=INT "$ceiling" make upgrade-test

  pin-delta:
    # What a pin bump changed, read from two chart tarballs. It reports; it does
    # not gate.
    #
    # Deliberately NOT one of the required status checks. It reaches four
    # external registries, and making a required check depend on Docker Hub being
    # up would turn it red for reasons that have nothing to do with this
    # repository -- which is how a check becomes something people click past.
    #
    # The script's three exit codes carry a distinction worth keeping, so this
    # step keeps it. 0 (no delta) and 1 (findings) both pass: an upstream
    # maintainer tightening a regex is a fact about their release, not a fault
    # here. Only 2 fails, because "the chart would not pull" means the report
    # proved nothing, and a report that proved nothing must not read as a clean
    # bill of health.
    name: pin delta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - name: install yq
        run: |
          # shellcheck disable=SC1091
          source versions.env
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/v${CI_YQ_VERSION}/yq_linux_amd64" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq --version

      - name: pin delta
        run: |
          # mkdir FIRST, before anything writes into it. The bring-up job learned
          # this one the expensive way: a redirect into a directory that does not
          # exist yet kills the step before the upload it was meant to feed ever
          # runs, and the artifact is then missing for a reason the log does not
          # obviously explain.
          mkdir -p .ci-artifacts/pin-delta
          export PIN_DELTA_WORKDIR="${RUNNER_TEMP}/pin-delta"
          set +e
          ./scripts/pin-delta.sh > .ci-artifacts/pin-delta/report.txt 2>&1
          rc=$?
          set -e
          # The model tables behind the report. The report names a finding in one
          # line; these are every field path and every constraint the comparison
          # actually read, both sides, per component -- which is what following a
          # finding up needs. The rendered charts and pulled tarballs stay in
          # RUNNER_TEMP: they are large, and regenerating them is one command.
          for kind in fields constraints resources vermap; do
            cp "${PIN_DELTA_WORKDIR}"/*."${kind}" .ci-artifacts/pin-delta/ \
              || echo "pin delta: no ${kind} tables (the script exited ${rc} before modelling)"
          done
          # The verdict the rollback leg reads. Copied explicitly rather than by
          # the loop above, because unlike the tables it is not optional: if it
          # is missing the leg reports UNCLASSIFIED, and a silent miss here
          # would look like a registry problem rather than a bug.
          cp "${PIN_DELTA_WORKDIR}/storage-verdict.txt" .ci-artifacts/pin-delta/ \
            || echo "pin delta: NO STORAGE VERDICT WRITTEN (script exited ${rc} before the report)"
          echo "$rc" > .ci-artifacts/pin-delta/exit-code.txt
          ls -l .ci-artifacts/pin-delta/
          case "$rc" in
            0) echo "pin delta: no delta" ;;
            1) echo "pin delta: findings -- read .ci-artifacts/pin-delta/report.txt" ;;
            *) echo "pin delta: could not run (exit $rc)"; exit "$rc" ;;
          esac

      - name: confirm the report was written before uploading it
        if: always()
        run: |
          test -s .ci-artifacts/pin-delta/report.txt \
            || { echo "pin delta: no report was written -- there is nothing to upload"; exit 1; }
          printf 'report.txt  %s lines  %s bytes\n' \
            "$(wc -l < .ci-artifacts/pin-delta/report.txt | tr -d ' ')" \
            "$(wc -c < .ci-artifacts/pin-delta/report.txt | tr -d ' ')"
          printf 'tables      %s lines across %s files\n' \
            "$(cat .ci-artifacts/pin-delta/*.fields .ci-artifacts/pin-delta/*.constraints \
                   .ci-artifacts/pin-delta/*.resources .ci-artifacts/pin-delta/*.vermap | wc -l | tr -d ' ')" \
            "$(find .ci-artifacts/pin-delta -type f | wc -l | tr -d ' ')"

      - name: summary
        if: always()
        run: |
          { echo '### pin delta'
            echo '```'
            cat .ci-artifacts/pin-delta/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pin-delta
          path: .ci-artifacts/pin-delta/
          # Same flag, same reason as the bring-up job: .ci-artifacts is a hidden
          # path and upload-artifact@v4 defaults include-hidden-files to false,
          # so its glob skips the dot-directory outright and reports "No files
          # were found with the provided path" on an otherwise green job.
          include-hidden-files: true
          retention-days: 30

  schema-check:
    # Every rendered manifest, validated against each Kubernetes version the
    # matrix brings up. No cluster, about a minute.
    #
    # This is the one thing the three bring-up legs catch that a single leg would
    # not: an API removed in a version we still cover. Catching it here does not
    # make the matrix redundant -- the legs still prove bring-up BEHAVIOUR -- but
    # it does mean the API-compatibility argument for three legs no longer stands
    # on its own. That decision is recorded in the roadmap, not made here.
    #
    # Exit codes are read differently from pin-delta's, and the difference is the
    # point. pin-delta passes on 1 because an upstream maintainer changing a
    # schema is a fact, not a fault. Here 1 means an object we install names an
    # API a covered version does not have, which fails at apply time on that
    # version. So only 0 passes: 1 is a defect, 2 means the check could not run
    # and therefore proved nothing.
    #
    # Not a required status check, same reasoning pin-delta gets: it depends on
    # four registries and on raw.githubusercontent.com, and a required check that
    # goes red when someone else's CDN is down is a check people learn to click
    # past.
    name: schema check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - name: install kubeconform and yq
        run: |
          # shellcheck disable=SC1091
          source versions.env
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${CI_KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/v${CI_YQ_VERSION}/yq_linux_amd64" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq --version

      - name: schema check
        run: |
          # mkdir FIRST, before anything redirects into it -- the same trap the
          # bring-up and pin-delta jobs both document.
          mkdir -p .ci-artifacts/schema-check
          export SCHEMA_CHECK_WORKDIR="${RUNNER_TEMP}/schema-check"
          set +e
          ./scripts/schema-check.sh > .ci-artifacts/schema-check/report.txt 2>&1
          rc=$?
          set -e
          # The per-version kubeconform output behind the report. The report says
          # WHICH api disappeared on which leg; these say what every object on
          # every leg resolved to, which is what following that up needs.
          cp "${SCHEMA_CHECK_WORKDIR}"/rows-*.tsv .ci-artifacts/schema-check/ \
            || echo "schema check: no per-version rows (exited ${rc} before validating)"
          cp "${SCHEMA_CHECK_WORKDIR}/summary.tsv" .ci-artifacts/schema-check/ \
            || echo "schema check: no summary table (exited ${rc} before classifying)"
          echo "$rc" > .ci-artifacts/schema-check/exit-code.txt
          ls -l .ci-artifacts/schema-check/
          case "$rc" in
            0) echo "schema check: no removed API, no schema violation" ;;
            1) echo "schema check: FINDINGS -- read .ci-artifacts/schema-check/report.txt"; exit 1 ;;
            *) echo "schema check: COULD NOT RUN (exit $rc) -- nothing was proved"; exit "$rc" ;;
          esac

      - name: confirm the report was written before uploading it
        if: always()
        run: |
          test -s .ci-artifacts/schema-check/report.txt \
            || { echo "schema check: no report was written -- there is nothing to upload"; exit 1; }
          printf 'report.txt  %s lines  %s bytes\n' \
            "$(wc -l < .ci-artifacts/schema-check/report.txt | tr -d ' ')" \
            "$(wc -c < .ci-artifacts/schema-check/report.txt | tr -d ' ')"
          printf 'rows        %s lines across %s file(s)\n' \
            "$(cat .ci-artifacts/schema-check/rows-*.tsv 2>/dev/null | wc -l | tr -d ' ')" \
            "$(find .ci-artifacts/schema-check -name 'rows-*.tsv' | wc -l | tr -d ' ')"

      - name: summary
        if: always()
        run: |
          { echo '### schema check'
            echo '```'
            cat .ci-artifacts/schema-check/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: schema-check
          path: .ci-artifacts/schema-check/
          # .ci-artifacts is a hidden path and upload-artifact@v4 defaults
          # include-hidden-files to false; without this the glob skips the
          # dot-directory and reports "No files were found" on a green job.
          include-hidden-files: true
          retention-days: 30

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: install trivy and syft
        run: |
          trivy_version=0.74.0
          syft_version=1.19.0
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${trivy_version}/trivy_${trivy_version}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          curl -fsSL "https://github.com/anchore/syft/releases/download/v${syft_version}/syft_${syft_version}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin syft
          trivy --version
          syft --version

      - name: scan the tree for misconfiguration and secrets
        # Both hard failures. The pre-push gate already refuses secrets, and a
        # second opinion that only warns is not a second opinion.
        #
        # tests/ is skipped, and only tests/. Six of the files under it are
        # Deployments that break exactly one guardrail each -- they exist to be
        # rejected, `make policy-test` asserts that they are, and a scanner
        # reporting them as insecure is agreeing with the fixture rather than
        # finding anything. Skipping the directory keeps that agreement from
        # drowning a real finding somewhere else. Everything the platform
        # actually deploys is scanned.
        run: |
          trivy config --exit-code 1 --severity HIGH,CRITICAL --skip-dirs tests .
          trivy fs --scanners secret --exit-code 1 .

      - name: build the two images this repository ships
        run: |
          # shellcheck disable=SC1091
          source versions.env
          docker build -q -t "${GIT_SERVER_IMAGE_REPO}:${GIT_SERVER_IMAGE_TAG}" bootstrap/git-server
          docker build -q -t "${SAMPLE_IMAGE_REPO}:${SAMPLE_IMAGE_TAG}" \
            --build-arg "BASE=${SAMPLE_IMAGE_FALLBACK}" bootstrap/fallback-workload
          docker images --format '  {{.Repository}}:{{.Tag}}  {{.Size}}' | grep platform.local

      - name: scan both images -- CRITICAL fails the build
        # This was continue-on-error with a comment claiming a CRITICAL here
        # would usually be an unfixed CVE with no patched release to move to.
        # That was never measured, and it is wrong. Measured on 2026-09-06:
        #
        #   git-server   CRITICAL 0   HIGH  2   (libcrypto3, libssl3)
        #   quote-api    CRITICAL 0   HIGH 33   (c-ares, curl, libcrypto3,
        #                                        libcurl, libexpat, libssl3,
        #                                        libuuid, libxml2)
        #
        # All 35 HIGH findings have a fixed version available. None of them is
        # unfixable; the two pinned bases are simply behind.
        #
        # So CRITICAL is enforced -- it is 0 on both images today, which makes it
        # a gate that holds rather than a gate that is switched off. HIGH is
        # reported, and the blocker for raising the gate to HIGH is named rather
        # than implied: 35 fixable findings from a digest-pinned Alpine
        # (bootstrap/git-server/Dockerfile) and a tag-pinned nginx
        # (versions.env SAMPLE_IMAGE_FALLBACK). Move those two pins and the gate
        # can be raised. Renovate watches both: the Dockerfile base directly,
        # and the versions.env pin through a custom regex manager, because a
        # build argument has no FROM line for a packaged manager to read.
        run: |
          set -euo pipefail
          source versions.env
          for image in "${GIT_SERVER_IMAGE_REPO}:${GIT_SERVER_IMAGE_TAG}" \
                       "${SAMPLE_IMAGE_REPO}:${SAMPLE_IMAGE_TAG}"; do
            echo "::group::${image} CRITICAL gate"
            trivy image --quiet --exit-code 1 --severity CRITICAL "$image"
            echo "::endgroup::"
          done

      - name: report HIGH findings, which are not yet gated
        run: |
          source versions.env
          for image in "${GIT_SERVER_IMAGE_REPO}:${GIT_SERVER_IMAGE_TAG}" \
                       "${SAMPLE_IMAGE_REPO}:${SAMPLE_IMAGE_TAG}"; do
            {
              echo "### $image"
              echo '```'
              trivy image --severity HIGH,CRITICAL --format table "$image" 2>&1 | tail -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: write an SBOM for each image
        run: |
          source versions.env
          mkdir -p sbom
          syft "${GIT_SERVER_IMAGE_REPO}:${GIT_SERVER_IMAGE_TAG}" \
            -o spdx-json=sbom/git-server.spdx.json
          syft "${SAMPLE_IMAGE_REPO}:${SAMPLE_IMAGE_TAG}" \
            -o spdx-json=sbom/quote-api.spdx.json
          ls -l sbom/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/
          retention-days: 30
