# Everything `make check` runs, plus the two things it cannot: a real bring-up on
# a real cluster, and a look at what this repository would ship.
#
# Actions are pinned by commit SHA, not by tag. versions.env argues that a tag is
# a name and a digest is a fact, and pins the kind node image accordingly; a tag
# here would be the same mutable reference the rest of the repository refuses.
# The tag is kept in a trailing comment so the pin stays readable.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read at the top, and restated on every job below. The top-level default alone
# would be enough today; restating it means a job added later inherits nothing by
# accident, and any job that ever needs more has to say so on its own line where
# a reviewer will see it. No job here needs more than read -- artifact upload
# goes through the Actions API, not contents.
permissions:
  contents: read

jobs:
  lint:
    name: chart · manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          # Verified against both 3.19 and 4.2: the chart renders identically
          # under each, modulo blank lines, and values.schema.json is enforced
          # by both. CI pins the 3.x line because that is what most clusters
          # still run.
          version: v3.19.0
      - name: install kubeconform
        run: |
          version=0.8.0
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${version}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: prove recipes run with errexit and pipefail
        # Guards the make 3.81 trap: .SHELLFLAGS is silently ignored there, so a
        # failing step in a recipe can report success. Cheap, and it fails loudly.
        run: make shell-check
      - name: helm lint, render, schema and manifest validation
        run: make lint
      - name: every environment renders, validates and passes the guardrails
        # Three environments times two tenants, plus an assertion that the three
        # actually differ -- an environment layer that renders identically
        # everywhere is decoration, and would otherwise pass silently.
        run: make check-environments
      - name: versions.env agrees with every Application manifest
        # The Application manifests cannot source a shell file, so each carries
        # its chart version literally. This is the check that keeps that
        # duplication from drifting.
        run: make check-versions

  policy:
    name: guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: install the kyverno CLI
        run: |
          # Pinned to the version the suite was verified against. The CLI's
          # Value/variables file format has changed between minor releases, and
          # a mismatch shows up as every rule silently "Excluded" rather than as
          # an error.
          version=1.19.0
          curl -sSL "https://github.com/kyverno/kyverno/releases/download/v${version}/kyverno-cli_v${version}_linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin kyverno
          kyverno version
      - name: every policy, both directions
        # Asserts that violations fail AND that compliant resources pass. A
        # policy matching everything and a policy matching nothing both look
        # correct if only one direction is checked, and matching-everything is
        # the bug this repository actually shipped once.
        run: make policy-test

  identity:
    name: identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The gate checks every commit, so it needs every commit. With the
          # default shallow clone it would check one and report success.
          fetch-depth: 0
      - name: install gitleaks
        run: |
          version=8.24.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: identity and attribution over all history
        # The same file the pre-push hook runs, in its --all-history mode. The
        # hook is per-clone configuration and does not travel with a clone, so
        # this is the copy nobody can forget to install.
        run: ./.githooks/pre-push --all-history
      - name: prove the gate still rejects bad history
        run: ./.githooks/selftest.sh

  cluster:
    # The whole platform, brought up on three Kubernetes versions. versions.env
    # says the charts support up to 1.34; running only 1.34 makes that half a
    # claim. fail-fast is off because "1.32 broke and 1.33 was cancelled" is
    # strictly less useful than knowing about both.
    name: bring-up · demo · k8s ${{ matrix.k8s.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - version: "1.32"
            image: "kindest/node:v1.32.11@sha256:5fc52d52a7b9574015299724bd68f183702956aa4a2116ae75a63cb574b35af8"
          - version: "1.33"
            image: "kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4"
          - version: "1.34"
            image: "kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a"
    env:
      # The one variable versions.env lets the environment win, so a matrix leg
      # can pick its node image without the file being rewritten.
      KIND_NODE_IMAGE: ${{ matrix.k8s.image }}
    # A bounded ceiling above the platform's own: up.sh allows 900s per component
    # and 900s to converge, and the demo adds a few minutes. If this job runs long
    # it has hung, and a hung job should be killed rather than waited on.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - name: install kind
        run: |
          version=0.33.0
          curl -sSLo /usr/local/bin/kind \
            "https://kind.sigs.k8s.io/dl/v${version}/kind-linux-amd64"
          chmod +x /usr/local/bin/kind
          kind --version

      - name: what the runner is offering
        # up.sh refuses on CPU, memory and Docker's image store, and each refusal
        # names the setting. Printing the inputs first means a preflight failure
        # reads as a fact about the runner rather than a mystery.
        run: |
          docker system info --format \
            'NCPU={{.NCPU}}  MemTotal={{.MemTotal}}  Driver={{.Driver}}'
          echo "MemTotal MiB: $(( $(docker system info --format '{{.MemTotal}}') / 1048576 ))"
          echo "node image  : ${KIND_NODE_IMAGE}"

      # No sibling checkout, deliberately. This is the path a person cloning
      # this repository actually takes, so it is the path CI has to prove: the
      # fallback workload in bootstrap/fallback-workload is built and must reach
      # Ready on the chart's own probes. A green run here means a stranger can
      # clone and get a working platform.
      - name: make up
        run: make up

      - name: make demo
        run: make demo

      - name: the result, for the log
        if: always()
        run: |
          echo '### Applications' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl -n argocd get applications >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### Control plane restarts' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl -n kube-system get pods \
            -o custom-columns='NAME:.metadata.name,RESTARTS:.status.containerStatuses[0].restartCount' \
            >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: diagnostics if it did not converge
        if: failure()
        run: |
          kubectl -n argocd get applications -o wide || true
          kubectl get pods -A || true
          kubectl -n kube-system get pods || true
          for app in $(kubectl -n argocd get applications -o name 2>/dev/null); do
            echo "--- $app ---"
            kubectl -n argocd get "$app" \
              -o jsonpath='{.status.conditions[*].message}{"\n"}' || true
          done

  upgrade:
    # The other cluster job builds from nothing, which proves the platform can be
    # created. This proves it can be moved -- which is what every dependency bump
    # actually asks for, and where CRD migrations and webhook downtime
    # show up. One version only: the upgrade path is orthogonal to the Kubernetes
    # version, and three of these would cost half an hour to learn the same thing.
    name: upgrade in place
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # upgrade-test.sh builds a commit with git plumbing, so it needs a
          # real repository rather than a shallow one.
          fetch-depth: 0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - name: install kind
        run: |
          version=0.33.0
          curl -sSLo /usr/local/bin/kind \
            "https://kind.sigs.k8s.io/dl/v${version}/kind-linux-amd64"
          chmod +x /usr/local/bin/kind
          kind --version
      - name: git identity for the scratch commit
        # commit-tree needs an author. The ref is deleted on exit and never
        # published anywhere but the in-cluster mirror.
        run: |
          git config user.name  "Paul Bezilla"
          git config user.email "bezilla@protonmail.com"
      - name: install the previous versions, then upgrade to the pinned ones
        run: make upgrade-test

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: install trivy and syft
        run: |
          trivy_version=0.58.2
          syft_version=1.19.0
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${trivy_version}/trivy_${trivy_version}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          curl -sSL "https://github.com/anchore/syft/releases/download/v${syft_version}/syft_${syft_version}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin syft
          trivy --version
          syft --version

      - name: scan the tree for misconfiguration and secrets
        # Both hard failures. The pre-push gate already refuses secrets, and a
        # second opinion that only warns is not a second opinion.
        #
        # tests/ is skipped, and only tests/. Six of the files under it are
        # Deployments that break exactly one guardrail each -- they exist to be
        # rejected, `make policy-test` asserts that they are, and a scanner
        # reporting them as insecure is agreeing with the fixture rather than
        # finding anything. Skipping the directory keeps that agreement from
        # drowning a real finding somewhere else. Everything the platform
        # actually deploys is scanned.
        run: |
          trivy config --exit-code 1 --severity HIGH,CRITICAL --skip-dirs tests .
          trivy fs --scanners secret --exit-code 1 .

      - name: build the two images this repository ships
        run: |
          # shellcheck disable=SC1091
          source versions.env
          docker build -q -t "${GIT_SERVER_IMAGE_REPO}:${GIT_SERVER_IMAGE_TAG}" bootstrap/git-server
          docker build -q -t "${SAMPLE_IMAGE_REPO}:${SAMPLE_IMAGE_TAG}" \
            --build-arg "BASE=${SAMPLE_IMAGE_FALLBACK}" bootstrap/fallback-workload
          docker images --format '  {{.Repository}}:{{.Tag}}  {{.Size}}' | grep platform.local

      - name: scan both images -- CRITICAL fails the build
        # This was continue-on-error with a comment claiming a CRITICAL here
        # would usually be an unfixed CVE with no patched release to move to.
        # That was never measured, and it is wrong. Measured on 2026-09-06:
        #
        #   git-server   CRITICAL 0   HIGH  2   (libcrypto3, libssl3)
        #   quote-api    CRITICAL 0   HIGH 33   (c-ares, curl, libcrypto3,
        #                                        libcurl, libexpat, libssl3,
        #                                        libuuid, libxml2)
        #
        # All 35 HIGH findings have a fixed version available. None of them is
        # unfixable; the two pinned bases are simply behind.
        #
        # So CRITICAL is enforced -- it is 0 on both images today, which makes it
        # a gate that holds rather than a gate that is switched off. HIGH is
        # reported, and the blocker for raising the gate to HIGH is named rather
        # than implied: 35 fixable findings from a digest-pinned Alpine
        # (bootstrap/git-server/Dockerfile) and a tag-pinned nginx
        # (versions.env SAMPLE_IMAGE_FALLBACK). Move those two pins and the gate
        # can be raised. Renovate watches both: the Dockerfile base directly,
        # and the versions.env pin through a custom regex manager, because a
        # build argument has no FROM line for a packaged manager to read.
        run: |
          set -euo pipefail
          source versions.env
          for image in "${GIT_SERVER_IMAGE_REPO}:${GIT_SERVER_IMAGE_TAG}" \
                       "${SAMPLE_IMAGE_REPO}:${SAMPLE_IMAGE_TAG}"; do
            echo "::group::${image} CRITICAL gate"
            trivy image --quiet --exit-code 1 --severity CRITICAL "$image"
            echo "::endgroup::"
          done

      - name: report HIGH findings, which are not yet gated
        run: |
          source versions.env
          for image in "${GIT_SERVER_IMAGE_REPO}:${GIT_SERVER_IMAGE_TAG}" \
                       "${SAMPLE_IMAGE_REPO}:${SAMPLE_IMAGE_TAG}"; do
            echo "### $image" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            trivy image --severity HIGH,CRITICAL --format table "$image" \
              2>&1 | tail -40 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: write an SBOM for each image
        run: |
          source versions.env
          mkdir -p sbom
          syft "${GIT_SERVER_IMAGE_REPO}:${GIT_SERVER_IMAGE_TAG}" \
            -o spdx-json=sbom/git-server.spdx.json
          syft "${SAMPLE_IMAGE_REPO}:${SAMPLE_IMAGE_TAG}" \
            -o spdx-json=sbom/quote-api.spdx.json
          ls -l sbom/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/
          retention-days: 30
