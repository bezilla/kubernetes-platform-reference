# The stand-in for your Git provider.
#
# Argo CD reconciles a cluster towards a Git repository, so a demonstration of
# Argo CD needs a repository Argo CD can reach. This repo is meant to be cloned
# and run locally, possibly with no remote at all, so `make up` mirrors the
# working tree into this pod and Argo clones from here. `make publish` is this
# setup's `git push`.
#
# It is deliberately dumb HTTP: a bare repository on disk, `update-server-info`
# run over it, and a static file server. No auth, no smart transport, no state
# worth backing up. In a real environment you delete this file and point
# bootstrap/root-application.yaml at GitHub, GitLab or Bitbucket -- the only
# thing that changes is the repoURL.
#
# Applied by `make up` alongside Argo CD, not by Argo CD. These two are the
# bootstrap; everything else in the platform is an Application.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    app.kubernetes.io/part-of: platform
    # Deliberately absent: platform.internal/paved-road. The guardrails apply to
    # tenant namespaces, and this namespace holds platform plumbing that the
    # platform team owns. See DESIGN.md, "Where the guardrails apply".
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: git-server-nginx
  namespace: platform-system
data:
  default.conf: |
    server {
      listen 8080;
      root /srv/git;
      autoindex on;
      location / {
        # Loose and packed objects, info/refs and HEAD are all just files.
        # That is the whole of the dumb HTTP protocol.
        add_header Cache-Control "no-store";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: platform-system
  labels: {app.kubernetes.io/name: git-server, app.kubernetes.io/part-of: platform}
spec:
  replicas: 1
  strategy: {type: Recreate}   # the repository lives in emptyDir; do not run two
  selector:
    matchLabels: {app.kubernetes.io/name: git-server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: git-server, app.kubernetes.io/part-of: platform}
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports: [{name: http, containerPort: 8080}]
          volumeMounts:
            - {name: conf,  mountPath: /etc/nginx/conf.d}
            - {name: repos, mountPath: /srv/git}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run,   mountPath: /var/run}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 2
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits:   {cpu: 200m, memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - {name: conf,  configMap: {name: git-server-nginx}}
        - {name: repos, emptyDir: {}}
        - {name: cache, emptyDir: {}}
        - {name: run,   emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: platform-system
spec:
  selector: {app.kubernetes.io/name: git-server}
  ports: [{name: http, port: 80, targetPort: http}]
