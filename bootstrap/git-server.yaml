# The stand-in for your Git provider.
#
# Argo CD reconciles a cluster towards a Git repository, so a demonstration of
# Argo CD needs a repository Argo CD can reach. This repo is meant to be cloned
# and run locally, possibly with no remote at all, so `make up` mirrors the
# working tree into this pod and Argo clones from here. `make publish` is this
# setup's `git push`.
#
# It serves SMART HTTP, via `git http-backend` under lighttpd's mod_cgi. That is
# not a detail: Argo CD's repo server is go-git, go-git speaks only the smart
# transport, and a static file server -- which is what this was first written as
# -- returns the plain refs file to the smart handshake and produces "failed to
# list refs: unexpected EOF" on every sync, forever. See the Dockerfile.
#
# Stateless by construction: the repository lives in an emptyDir and is
# repopulated by scripts/publish.sh. Nothing here is worth backing up, there is
# no database, and deleting the pod costs one `make publish`.
#
# In a real environment you delete this file and point bootstrap/root-application
# and the Applications under platform/applications at GitHub, GitLab or
# Bitbucket. The only thing that changes is the repoURL.
#
# Applied by `make up` alongside Argo CD, not by Argo CD. These two are the
# bootstrap; everything else in the platform is an Application.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    app.kubernetes.io/part-of: platform
    # Deliberately absent: platform.internal/paved-road. The guardrails apply to
    # tenant namespaces, and this namespace holds platform plumbing that the
    # platform team owns. See DESIGN.md, "Where the guardrails apply".
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: git-server-lighttpd
  namespace: platform-system
data:
  lighttpd.conf: |
    # Everything is CGI. There are no static files to serve -- git-http-backend
    # answers both the smart endpoints and the dumb ones, so routing anything
    # around it would only create a second way to be wrong.
    # mod_alias and mod_setenv are compiled into lighttpd 1.4.85 rather than
    # shipped as .so files, but they must still be DECLARED here -- omit them
    # and their directives are silently ignored as "unknown config-key", which
    # yields a server that starts cleanly and 404s every request.
    server.modules = ("mod_alias", "mod_setenv", "mod_cgi", "mod_accesslog")
    server.port     = 8080
    server.document-root = "/srv/www"

    # Stream the CGI in both directions rather than buffering it.
    #
    # Without these, the smart-HTTP handshake succeeds -- info/refs returns 200
    # and the pkt-line preamble is correct -- and then the actual fetch dies
    # with "curl 18 transfer closed with outstanding read data remaining" and
    # "fatal: expected 'packfile'". The negotiation is a POST whose response is
    # a streamed packfile, and buffered mod_cgi truncates it. The failure is
    # especially misleading because every probe and every handshake still passes:
    # the server looks healthy and no clone can complete.
    server.stream-response-body = 2
    server.stream-request-body  = 2

    # Logs to stderr so `kubectl logs` works and nothing needs a writable
    # /var/log. An unset errorlog means stderr in lighttpd.
    server.pid-file = ""
    accesslog.filename = "/dev/stderr"

    # Everything under /git is the CGI program, and the rest of the path becomes
    # PATH_INFO -- so /git/platform.git/info/refs reaches git-http-backend as
    # /platform.git/info/refs, which is what it expects.
    #
    # The prefix is structural, not cosmetic. lighttpd builds the physical path
    # by concatenating the alias target with whatever follows the matched
    # prefix, so a prefix of "/" produces "...git-http-backendplatform.git/..."
    # with no separator and 404s. The repository name has to survive into
    # PATH_INFO, so it has to sit after a non-empty prefix. Real remotes carry a
    # path too; this one is /git.
    alias.url += ( "/git" => "/usr/libexec/git-core/git-http-backend" )
    cgi.assign = ( "" => "" )

    # Where lighttpd puts a chunk it cannot hold in memory. The name says
    # "upload", which is misleading: this is the temp directory for any request
    # body that outgrows the in-memory buffer, not a file-upload feature. It
    # defaults to /var/tmp, and /var/tmp here is on the read-only root
    # filesystem -- the container writes only to the emptyDirs mounted at /tmp,
    # /srv/git and /srv/www.
    #
    # Unset, a spill fails with
    #
    #   (chunk.c.928) opening temp-file failed:
    #       /var/tmp/lighttpd-upload-XXXXXX: Read-only file system
    #
    # and lighttpd abandons the response mid-stream. The client sees a truncated
    # transfer -- "curl 18 transfer closed with outstanding read data remaining",
    # "fatal: early EOF", "fatal: fetch-pack: invalid index-pack output" -- which
    # Argo CD caches as a manifest-generation failure, so the Application sits
    # Unknown until a later reconcile succeeds.
    #
    # Removing this line reintroduces that. Verified both directions on a live
    # cluster: an 8MB request body fails with the error above and succeeds with
    # it set.
    #
    # THIS IS NOT THE argocd-repositories STALL, and this comment used to say it
    # was. The threshold was measured afterwards: lighttpd spills a request body
    # once it outgrows a 64 KiB in-memory buffer -- no spill at 64KB, spill at
    # 65KB -- and it governs REQUEST BODIES only, with a 371,880-byte response
    # against a 130-byte body not spilling. The git-upload-pack request bodies
    # in the failing CI runs were 162 and 303 bytes, two to three orders of
    # magnitude below the threshold, so they cannot have spilled. This fix
    # closes a real failure mode that a large enough fetch negotiation would
    # hit. It does not explain the stall, which is open -- see ROADMAP.md.
    server.upload-dirs = ( "/tmp" )

    setenv.add-environment = (
      "GIT_PROJECT_ROOT"    => "/srv/git",
      # Serve every repository under the project root without needing a
      # git-daemon-export-ok marker in each. There is exactly one repository
      # here and it is public by design.
      "GIT_HTTP_EXPORT_ALL" => "1"
    )
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: platform-system
  labels: {app.kubernetes.io/name: git-server, app.kubernetes.io/part-of: platform}
spec:
  replicas: 1
  strategy: {type: Recreate}   # the repository lives in emptyDir; do not run two
  selector:
    matchLabels: {app.kubernetes.io/name: git-server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: git-server, app.kubernetes.io/part-of: platform}
    spec:
      # Pod level as well as container level. The container below already sets
      # all of this, so nothing about how this pod runs changes -- but a default
      # pod security context is what any container added later inherits, and
      # "the one container happens to set it" is a property of today's manifest
      # rather than of the workload. The platform demands non-root of every
      # tenant; its own bootstrap should not be the exception.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: lighttpd
          image: platform.local/git-server:0.1.0
          # Side-loaded into the kind node by scripts/git-server-image.sh. There
          # is no registry to pull it from, so asking would fail.
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 8080}]
          volumeMounts:
            - {name: conf,  mountPath: /etc/lighttpd}
            - {name: repos, mountPath: /srv/git}
            - {name: www,   mountPath: /srv/www}
            - {name: tmp,   mountPath: /tmp}
          readinessProbe:
            # Probes the smart handshake against the real repository, not `/`.
            # A server that is listening but cannot run CGI answers `/` happily
            # and fails every sync -- which is the failure this file exists to
            # fix, so it is the failure the probe should catch.
            httpGet: {path: "/git/platform.git/info/refs?service=git-upload-pack", port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
            # 404 until the first publish, and that is correct: with no
            # repository to serve, this pod is not ready to be Argo's remote.
            failureThreshold: 60
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits:   {cpu: 500m, memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
      volumes:
        - {name: conf,  configMap: {name: git-server-lighttpd}}
        - {name: repos, emptyDir: {}}
        - {name: www,   emptyDir: {}}
        - {name: tmp,   emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: platform-system
spec:
  selector: {app.kubernetes.io/name: git-server}
  ports: [{name: http, port: 80, targetPort: http}]
