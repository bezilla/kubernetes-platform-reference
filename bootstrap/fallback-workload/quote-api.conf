# The fallback workload's whole job is to be a service the paved-road chart can
# admit and the kubelet can prove healthy. It serves no quotes and emits no
# telemetry; what it demonstrates is the platform around it.

server {
	listen       8080;
	server_name  _;
	default_type text/plain;

	# The chart's startup AND readiness probes both point here
	# (charts/paved-road/values.yaml: health.path, mandatory at admission).
	# The stock nginx-unprivileged image serves no /healthz, so without this
	# location the startup probe fails 15 times at 2s intervals, the kubelet
	# kills the container, and the pod crash-loops for as long as anyone is
	# willing to watch it. That is the entire reason this file exists.
	location = /healthz {
		access_log off;
		return 200 'ok\n';
	}

	location / {
		return 200 'quote-api fallback. The platform is real; the workload is a placeholder.\n';
	}
}

# apps/quote-api/values.yaml declares a second container port named `pricing`,
# which the real service uses as an in-process dependency so its traces have a
# span to link. Nothing probes it, but a declared port that nothing listens on
# is a lie the next reader has to disprove, so answer there too.
server {
	listen       8081;
	server_name  _;
	default_type text/plain;

	location / {
		return 200 'pricing fallback\n';
	}
}
