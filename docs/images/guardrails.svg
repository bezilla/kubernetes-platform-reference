<text x="22" y="235" fill="#f85149" font-weight="600">REJECTED  untagged-image          disallow-latest-tag</text>
<text x="22" y="256" fill="#c9d1d9" font-weight="600">The same Deployment with nothing broken. It must be admitted.</text>
