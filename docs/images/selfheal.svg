<text x="424.0" y="24" fill="#8b949e" text-anchor="middle" font-size="12">make demo-selfheal · deleted out of band, back in 5 seconds</text>
<text x="22" y="67" fill="#58a6ff">$ make demo-selfheal</text>
<text x="22" y="109" fill="#c9d1d9" font-weight="600">The claim</text>
<text x="22" y="130" fill="#c9d1d9">  quote-api: selfHeal=true prune=true</text>
<text x="22" y="151" fill="#c9d1d9">  every Application in platform/applications/ sets the same</text>
<text x="22" y="172" fill="#c9d1d9" font-weight="600">Before</text>
<text x="22" y="193" fill="#c9d1d9">  quote-api   2     2</text>
<text x="22" y="214" fill="#c9d1d9">  uid c459c874-2919-4e2a-b33b-e7c3d83ba004</text>
<text x="22" y="235" fill="#c9d1d9" font-weight="600">Deleting it out of band — no commit, no Argo CD involvement</text>
<text x="22" y="256" fill="#c9d1d9">  deployment.apps &quot;quote-api&quot; deleted from tenant-quotes namespace</text>
<text x="22" y="277" fill="#c9d1d9">  confirmed: Deployment/quote-api no longer exists</text>
<text x="22" y="298" fill="#c9d1d9" font-weight="600">Waiting for Argo CD to notice and restore it</text>
<text x="22" y="319" fill="#f85149">    0s  deployment=absent   ready=0/?  app=OutOfSync</text>
<text x="22" y="340" fill="#3fb950">    5s  deployment=present  ready=2/2  app=Synced</text>
<text x="22" y="361" fill="#c9d1d9" font-weight="600">After</text>
<text x="22" y="382" fill="#c9d1d9">  quote-api   2     2</text>
<text x="22" y="403" fill="#c9d1d9">  uid e1ae396a-9fa1-4d68-8af9-fa9599ccac70</text>
<text x="22" y="424" fill="#3fb950">  the uid changed — this is a new object, rebuilt from Git, not the old one recovered</text>
<text x="22" y="445" fill="#3fb950">  Nobody ran a sync. Nobody committed anything. Git was still the desired state.</text>
</svg>
