<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1080" width="1180" height="1080"
     role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Platform architecture: Git to running workload, and the seam between the platform team and the app team</title>
  <desc id="dsc">A commit to this repository is the cluster's desired state. One Argo CD reconciles it
  through an app-of-apps: version-pinned Helm charts install cert-manager, Envoy Gateway, Kyverno and an
  OpenTelemetry collector, and the platform's own configuration declares a shared Gateway with a wildcard
  certificate. An authored Helm chart straddles a labelled boundary and is the whole interface an app team
  sees: they write a values file, the chart renders every object, and everything it renders already satisfies
  the four Kyverno guardrails that admission control enforces. A non-compliant deploy is refused at that gate.
  Along the bottom, the request path runs left to right: the host port, TLS terminating at the Gateway, the
  HTTPRoute the chart emitted, and the team's pods.</desc>

  <style>
    /* Colour carries ownership, not category:
         own   the platform team owns it, and this repository declares it
         ext   the app team owns it -- their values, their image, their code
         opt   the admission gate, and what it refuses
         piv   the request path, the one flow that crosses every layer
       Light values are the default so the diagram stays legible even where the
       colour-scheme query does not match the host page. Neither theme uses pure
       black or pure white. */
    :root{
      --bg:#eef1f6; --panel:#fafbfd; --ink:#1f2937; --dim:#4b5563;
      --own:#2f6fed; --ext:#5b6675; --opt:#a8570a; --pivot:#7241d6;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#141a23; --panel:#1c2531; --ink:#e6eaf1; --dim:#a7b2c2;
        --own:#74abff; --ext:#98a3b3; --opt:#f0b357; --pivot:#c3a3ff;
      }
    }
    .bg{fill:var(--bg)}
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
         fill:var(--ink)}
    .h1{font-size:24px;font-weight:700}
    .h2{font-size:14px;fill:var(--dim)}
    .zone{font-size:13px;font-weight:700;letter-spacing:.08em}
    .bt{font-size:15px;font-weight:600}
    .lbl{font-size:12.5px;fill:var(--dim)}
    .sm{font-size:11.5px;fill:var(--dim)}
    .edge{font-size:12px;font-weight:600}
    .panel{fill:var(--panel)}
    .own-s{stroke:var(--own);fill:none}
    .own-f{fill:var(--own);fill-opacity:.07;stroke:var(--own);stroke-opacity:.5}
    .ext-f{fill:var(--ext);fill-opacity:.08;stroke:var(--ext);stroke-opacity:.5}
    .opt-f{fill:var(--opt);fill-opacity:.08;stroke:var(--opt);stroke-opacity:.75;stroke-dasharray:7 5}
    .t-own{fill:var(--own)} .t-ext{fill:var(--ext)} .t-opt{fill:var(--opt)} .t-piv{fill:var(--pivot)}
    .f-own{fill:var(--own)} .f-ext{fill:var(--ext)} .f-opt{fill:var(--opt)} .f-piv{fill:var(--pivot)}
    .flow{stroke:var(--own);stroke-width:2;fill:none}
    .flow-ext{stroke:var(--ext);stroke-width:2;fill:none}
    .flow-opt{stroke:var(--opt);stroke-width:2;fill:none;stroke-dasharray:7 5}
    .flow-piv{stroke:var(--pivot);stroke-width:2;fill:none;stroke-dasharray:3 4}
    .bound{stroke:var(--ext);stroke-width:2;stroke-dasharray:9 7;fill:none}
    .slot{stroke:var(--own);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
  </style>

  <defs>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-own"/></marker>
    <marker id="me" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-ext"/></marker>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-opt"/></marker>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="f-piv"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="1080" rx="10"/>

  <text class="h1" x="40" y="44">The paved road — from a commit to a running, routable, compliant service</text>
  <text class="h2" x="40" y="68">One reconciler. One authored chart as the interface. Four guardrails that refuse anything else.</text>

  <!-- ===================== THE SEAM ===================== -->
  <!-- The boundary is the point of the diagram: everything left of it is decided
       once by the platform, everything right of it is what a team writes. -->
  <path class="bound" d="M812 96 V1000"/>
  <g transform="rotate(-90 812 200)">
    <text class="zone t-ext" x="812" y="200" text-anchor="middle" dy="-6">PLATFORM TEAM</text>
    <text class="zone t-ext" x="812" y="200" text-anchor="middle" dy="12">APP TEAM</text>
  </g>

  <!-- ===================== 1. GIT ===================== -->
  <text class="zone t-own" x="40" y="118">1 · DESIRED STATE</text>
  <rect class="own-f" x="40" y="132" width="300" height="96" rx="10"/>
  <rect class="panel" x="56" y="148" width="268" height="64" rx="7"/>
  <rect class="own-s" x="56" y="148" width="268" height="64" rx="7"/>
  <text class="bt" x="72" y="172">this repository</text>
  <text class="sm" x="72" y="192">platform/ · charts/ · apps/</text>
  <text class="sm" x="72" y="206">a commit is the only way in</text>

  <path class="flow" marker-end="url(#mo)" d="M190 228 V266"/>

  <!-- ===================== 2. ARGO CD ===================== -->
  <text class="zone t-own" x="40" y="292">2 · THE ONE RECONCILER</text>
  <rect class="own-f" x="40" y="306" width="300" height="120" rx="10"/>
  <rect class="panel" x="56" y="322" width="268" height="88" rx="7"/>
  <rect class="own-s" x="56" y="322" width="268" height="88" rx="7"/>
  <text class="bt" x="72" y="346">Argo CD · app-of-apps</text>
  <text class="sm" x="72" y="366">the only imperative install</text>
  <text class="sm" x="72" y="382">prune + selfHeal on every child</text>
  <text class="sm" x="72" y="398">one engine, never two — see DESIGN.md</text>

  <path class="flow" marker-end="url(#mo)" d="M340 366 H392"/>
  <text class="edge t-own" x="346" y="357">installs</text>

  <!-- ===================== 3. PLATFORM COMPONENTS ===================== -->
  <text class="zone t-own" x="392" y="292">3 · PLATFORM COMPONENTS · Helm, version-pinned</text>
  <rect class="own-f" x="392" y="306" width="380" height="120" rx="10"/>

  <rect class="panel" x="406" y="320" width="172" height="42" rx="6"/>
  <rect class="own-s" x="406" y="320" width="172" height="42" rx="6"/>
  <text class="lbl" x="418" y="338">cert-manager</text>
  <text class="sm" x="418" y="354">issues every certificate</text>

  <rect class="panel" x="588" y="320" width="172" height="42" rx="6"/>
  <rect class="own-s" x="588" y="320" width="172" height="42" rx="6"/>
  <text class="lbl" x="600" y="338">Envoy Gateway</text>
  <text class="sm" x="600" y="354">the Gateway API impl</text>

  <rect class="panel" x="406" y="372" width="172" height="42" rx="6"/>
  <rect class="own-s" x="406" y="372" width="172" height="42" rx="6"/>
  <text class="lbl" x="418" y="390">Kyverno</text>
  <text class="sm" x="418" y="406">admission webhook</text>

  <rect class="panel" x="588" y="372" width="172" height="42" rx="6"/>
  <rect class="own-s" x="588" y="372" width="172" height="42" rx="6"/>
  <text class="lbl" x="600" y="390">OTel collector</text>
  <text class="sm" x="600" y="406">OTLP in, backends out</text>

  <!-- ===================== APP TEAM INPUT ===================== -->
  <text class="zone t-ext" x="852" y="292">THE APP TEAM WRITES</text>
  <rect class="ext-f" x="852" y="306" width="288" height="120" rx="10"/>
  <rect class="panel" x="866" y="320" width="260" height="94" rx="7"/>
  <text class="bt" x="880" y="344">values.yaml</text>
  <text class="sm" x="880" y="364">owner.team · image · replicas</text>
  <text class="sm" x="880" y="380">resources.tier: nano | small | …</text>
  <text class="sm" x="880" y="396">ingress.subdomain</text>
  <text class="sm t-ext" x="880" y="410">and no YAML for anything below</text>

  <!-- ===================== 4. THE EDGE ===================== -->
  <path class="flow" marker-end="url(#mo)" d="M582 426 V462"/>
  <text class="zone t-own" x="40" y="488">4 · THE EDGE · platform-owned, declared once</text>
  <rect class="own-f" x="40" y="502" width="732" height="118" rx="10"/>

  <rect class="panel" x="56" y="518" width="222" height="86" rx="7"/>
  <rect class="own-s" x="56" y="518" width="222" height="86" rx="7"/>
  <text class="bt" x="70" y="540">Gateway · platform-edge</text>
  <text class="sm" x="70" y="559">one shared Gateway</text>
  <text class="sm" x="70" y="575">listener *.apps.platform.test</text>
  <text class="sm" x="70" y="591">allowedRoutes: paved-road only</text>

  <rect class="panel" x="294" y="518" width="222" height="86" rx="7"/>
  <rect class="own-s" x="294" y="518" width="222" height="86" rx="7"/>
  <text class="bt" x="308" y="540">wildcard certificate</text>
  <text class="sm" x="308" y="559">issued by the platform CA</text>
  <text class="sm" x="308" y="575">renewed by cert-manager</text>
  <text class="sm" x="308" y="591">no app team ever sees a CSR</text>

  <rect class="panel" x="532" y="518" width="224" height="86" rx="7"/>
  <rect class="own-s" x="532" y="518" width="224" height="86" rx="7"/>
  <text class="bt" x="546" y="540">GatewayClass</text>
  <text class="sm" x="546" y="559">names the implementation —</text>
  <text class="sm" x="546" y="575">the ONLY place Envoy appears.</text>
  <text class="sm" x="546" y="591">Swapping it changes no HTTPRoute.</text>

  <!-- ===================== THE WORKLOAD ===================== -->
  <text class="zone t-ext" x="852" y="488">THE WORKLOAD</text>
  <rect class="ext-f" x="852" y="502" width="288" height="118" rx="10"/>
  <rect class="panel" x="866" y="518" width="260" height="86" rx="7"/>
  <text class="bt" x="880" y="540">quote-api · 3 pods</text>
  <text class="sm" x="880" y="559">the team's image and code</text>
  <text class="sm" x="880" y="575">labelled with its owning team</text>
  <text class="sm" x="880" y="591">emitting OTLP it never configured</text>

  <!-- ===================== THE REQUEST PATH ===================== -->
  <!-- Its own lane, left to right, so the path is followed rather than traced
       through the middle of boxes that mean something else. -->
  <path class="flow-piv" marker-end="url(#mp)" d="M20 664 H1128"/>
  <path class="flow-piv" d="M167 664 V622"/>
  <path class="flow-piv" d="M996 664 V622"/>
  <text class="edge t-piv" x="20" y="654">THE REQUEST PATH</text>
  <text class="sm t-piv" x="150" y="684">localhost:8443 → NodePort</text>
  <text class="sm t-piv" x="352" y="684">TLS terminates at the Gateway</text>
  <text class="sm t-piv" x="590" y="684">the HTTPRoute selects the Service</text>
  <text class="sm t-piv" x="900" y="684">→ the team's pods</text>

  <!-- ===================== 5. THE AUTHORED CHART — the seam ===================== -->
  <text class="zone t-own" x="392" y="726">5 · THE INTERFACE — the seam</text>
  <rect class="slot" x="392" y="740" width="560" height="104" rx="10"/>
  <rect class="panel" x="408" y="756" width="528" height="72" rx="7"/>
  <rect class="own-s" x="408" y="756" width="528" height="72" rx="7"/>
  <text class="bt" x="424" y="780">charts/paved-road — the whole surface an app team touches</text>
  <text class="sm" x="424" y="800">renders Deployment · Service · HTTPRoute · ServiceAccount · PodDisruptionBudget</text>
  <text class="sm" x="424" y="816">and the restricted security profile, resource tier, probes and OTLP wiring — unasked</text>

  <path class="flow-ext" marker-end="url(#me)" d="M1120 426 V444 H1158 V776 Q1158 792 1142 792 H956"/>
  <text class="edge t-ext" x="1012" y="726">one file in</text>

  <path class="flow" marker-end="url(#mo)" d="M392 792 H340 Q324 792 324 776 V636 Q324 620 308 620 H302"/>
  <text class="edge t-own" x="122" y="726">the HTTPRoute attaches here</text>

  <path class="flow" marker-end="url(#mo)" d="M900 752 V624"/>
  <text class="edge t-own" x="920" y="708">creates the workload</text>

  <!-- ===================== 6. ADMISSION ===================== -->
  <path class="flow" marker-end="url(#mo)" d="M600 844 V884"/>
  <text class="zone t-opt" x="40" y="910">6 · ADMISSION · Kyverno, Enforce, tenant namespaces only</text>
  <rect class="opt-f" x="40" y="924" width="732" height="88" rx="10"/>

  <rect class="panel" x="56" y="938" width="166" height="30" rx="5"/>
  <text class="sm" x="66" y="958">require-resource-limits</text>
  <rect class="panel" x="234" y="938" width="152" height="30" rx="5"/>
  <text class="sm" x="244" y="958">disallow-latest-tag</text>
  <rect class="panel" x="398" y="938" width="180" height="30" rx="5"/>
  <text class="sm" x="408" y="958">require-ownership-labels</text>
  <rect class="panel" x="590" y="938" width="170" height="30" rx="5"/>
  <text class="sm" x="600" y="958">require-probes-and-nonroot</text>

  <text class="sm" x="56" y="994">Everything the chart renders already passes. Policy is the backstop for hand-written YAML, not a second interface.</text>

  <path class="flow-opt" marker-end="url(#mk)" d="M772 954 H852"/>
  <rect class="opt-f" x="852" y="924" width="288" height="60" rx="8"/>
  <text class="bt t-opt" x="868" y="950">a non-compliant deploy</text>
  <text class="sm" x="868" y="970">refused here, naming the rule that refused it</text>

  <!-- ===================== LEGEND ===================== -->
  <g transform="translate(40,1062)">
    <rect class="own-f" x="0" y="-10" width="24" height="12" rx="3"/>
    <text class="sm" x="30" y="0">platform team owns it — declared once, in this repository</text>
    <rect class="ext-f" x="392" y="-10" width="24" height="12" rx="3"/>
    <text class="sm" x="422" y="0">app team owns it — their values, their image</text>
    <rect class="opt-f" x="740" y="-10" width="24" height="12" rx="3"/>
    <text class="sm" x="770" y="0">the admission gate</text>
    <path class="flow-piv" d="M900 -4 H926"/>
    <text class="sm" x="934" y="0">the request path</text>
  </g>
</svg>
