<path d="M0 10a10 10 0 0 1 10-10h639a10 10 0 0 1 10 10v28H0z" fill="#161b22"/>
<line x1="0" y1="38" x2="659" y2="38" stroke="#30363d"/>
<circle cx="20" cy="19" r="5.5" fill="#ff5f56"/>
