# Pods, not Deployments, for the offline suite.
#
# The policies declare `kinds: [Pod]`; Kyverno's autogen then derives the
# Deployment/StatefulSet/DaemonSet variants at admission time. Testing the Pod
# form tests the rule as written rather than the rule as generated, so a failure
# here points at the policy and not at autogen.
#
# The cluster-side suite (scripts/demo-guardrails.sh) covers the Deployment form
# and the real admission path. Neither replaces the other.
apiVersion: v1
kind: Pod
metadata:
  name: compliant
  namespace: tenant-quotes
  labels:
    app.kubernetes.io/name: compliant
    platform.internal/team: payments
    platform.internal/owner: payments_at_example_com
spec:
  securityContext: {runAsNonRoot: true}
  containers:
    - name: app
      image: platform.local/quote-api:0.1.0
      readinessProbe: {httpGet: {path: /healthz, port: 8080}}
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits:   {cpu: 200m, memory: 64Mi}
---
