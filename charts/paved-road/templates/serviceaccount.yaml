{{- /*
A ServiceAccount per service, with no token mounted and no RoleBinding.

Sharing `default` across a namespace means any RBAC granted to one workload is
granted to all of them. Creating a distinct identity now costs nothing and is
what makes it possible to grant something later without granting it to
everything.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "paved-road.fullname" . }}
  labels: {{- include "paved-road.labels" . | nindent 4 }}
automountServiceAccountToken: false
