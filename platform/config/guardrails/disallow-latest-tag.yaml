# Why this exists
#
# `:latest` makes a Deployment's manifest and the thing it actually runs two
# different facts. Two replicas created a week apart run different code; a
# rollback rolls back to whatever `:latest` points at now, which is the version
# you are rolling back from. It also breaks the premise of GitOps: if the image
# reference does not change, Argo CD sees no drift and has nothing to
# reconcile, so the cluster can be wrong while every Application reads Synced.
#
# An untagged reference is the same defect spelled differently, so both are
# rejected.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow :latest and untagged images
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: image-tag-must-be-explicit
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels: {platform.internal/paved-road: "true"}
      validate:
        message: >-
          Images must carry an explicit tag that is not `latest`. A floating tag
          means the manifest and the running code are two different facts, and
          Argo CD cannot see the difference.
        # Written as a foreach/deny rather than a pattern. The pattern this
        # replaced was
        #     image: "!*:latest | !*:latest@* "
        # which looks like "not :latest, and not :latest with a digest" and is
        # neither. Kyverno patterns have no `|` alternation operator -- that is
        # what anyPattern is for -- so the whole thing was read as one literal
        # wildcard string, matched everything, and the rule admitted `:latest`
        # without complaint. It was verified by watching a `:latest` deployment
        # be accepted, not by reading the YAML, because reading the YAML is what
        # produced it.
        #
        # The regex covers both spellings: `repo:latest` and the digest-pinned
        # `repo:latest@sha256:...`, where [^@]* stops at the digest boundary. A
        # registry port (`host:5000/repo:latest`) still matches, because the
        # final `:latest` is what is being looked for, not the first colon.
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('^[^@]*:latest(@.*)?$', element.image) }}"
                    operator: Equals
                    value: true
    - name: image-tag-must-be-present
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels: {platform.internal/paved-road: "true"}
      validate:
        message: >-
          Images must carry an explicit tag. An untagged reference resolves to
          `latest` and has the same defect.
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                all:
                  # Anything after the last `/` that contains no `:` is untagged.
                  # Splitting on `/` first keeps a registry port (`host:5000/x`)
                  # from reading as a tag.
                  - key: "{{ regex_match('^[^:]+$', split(element.image, '/') | [-1]) }}"
                    operator: Equals
                    value: true
