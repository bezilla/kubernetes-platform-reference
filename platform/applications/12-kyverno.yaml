# Wave 2: the admission controller, ahead of the policies it enforces and ahead
# of any workload those policies must catch.
#
# Only the controllers this platform uses run. The cleanup controller manages
# TTL-based deletion, which nothing here declares; leaving it out is one fewer
# pod on a single-node cluster and one fewer thing whose failure would look like
# a policy failure.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  project: default
  # The API server defaults spec.conversion on every CRD it stores. Argo
  # normalizes that away for the core kinds it ships knowledge of, which is why
  # cert-manager and Envoy Gateway sit Synced with the same defaulting on their
  # Deployments and Services -- but not for CRDs.
  #
  # The labels and annotations entries are a different problem wearing the same
  # clothes. The chart renders `labels: {}` and `annotations: {}` on eleven of
  # its CRDs; the API server discards empty maps, so Git holds `{}` where the
  # cluster holds nothing, and Argo reports a difference that no sync can ever
  # settle. Ignoring metadata on a vendored CRD is a real if narrow loss -- a
  # label the chart adds later will not show as drift -- and is the cheaper side
  # of that trade against a permanently amber Application.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion
        - .metadata.labels
        - .metadata.annotations
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.9.0
    helm:
      releaseName: kyverno
      values: |
        admissionController:
          replicas: 1
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits:   {memory: 384Mi}
        backgroundController:
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits:   {memory: 192Mi}
        reportsController:
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits:   {memory: 192Mi}
        cleanupController:
          enabled: false
  destination: {server: https://kubernetes.default.svc, namespace: kyverno}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
