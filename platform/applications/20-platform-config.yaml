# Wave 3: everything the platform declares for itself once its controllers are
# running -- the tenant namespaces, the CA and ClusterIssuer, the GatewayClass,
# the shared Gateway and its wildcard certificate, and the NodePort that carries
# the edge out to the host.
#
# This is the layer that turns three installed controllers into a paved road. An
# app team gets TLS, a hostname and an edge without writing any of it, because
# it is declared here once.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-config
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  project: default
  # Gateway API defaults the group and kind on every reference: a parentRef
  # without a group is a Gateway, a backendRef without one is a Service. Writing
  # them out in the manifests would work too, and would mean every HTTPRoute an
  # app team ever writes carries four lines of boilerplate whose only purpose is
  # to keep a dashboard green.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: Gateway
      jqPathExpressions:
        - .spec.listeners[].allowedRoutes.kinds[].group
        - .spec.listeners[].tls.certificateRefs[].group
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .spec.parentRefs[].group
        - .spec.parentRefs[].kind
        - .spec.rules[].matches
    - group: gateway.envoyproxy.io
      kind: EnvoyProxy
      jqPathExpressions:
        - .spec.logging
        - .spec.provider.kubernetes.envoyService.externalTrafficPolicy
  source:
    repoURL: http://git-server.platform-system.svc/git/platform.git
    targetRevision: main
    path: platform/config/edge
    directory: {recurse: true}
  destination: {server: https://kubernetes.default.svc, namespace: platform-edge}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 8
      backoff: {duration: 10s, factor: 2, maxDuration: 2m}
