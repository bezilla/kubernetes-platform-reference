# Wave 0: cert-manager, ahead of anything that asks for a certificate.
#
# One component per wave, throughout. Waves 0-2 have no ordering dependency on
# each other -- cert-manager, Envoy Gateway and Kyverno are independent installs
# -- and were all wave 0 until three concurrent Helm installs plus their CRD
# registrations saturated a single-node cluster and starved the API server into
# a TLS handshake timeout.
#
# How much this actually serialises, measured rather than assumed: the waves
# order the CREATION of these Application objects, but each child below carries
# its own syncPolicy.automated, so a child begins syncing the moment it exists
# and does not wait for an earlier wave to finish. otel-collector at wave 5 was
# observed Synced while envoy-gateway at wave 1 was still Degraded. The waves
# stagger the start; they do not hold a barrier between components.
#
# Left as is deliberately. The alternative -- dropping automated sync from the
# children so the root drives every sync in strict order -- would buy a real
# barrier at the cost of self-healing and of the property that a commit changes
# the cluster on its own, which is the thing this repository exists to show.
# Staggered starts were enough: the API server stayed reachable for the whole
# install afterwards.
#
# Waves DO hold strictly within a single Application, where Argo waits for each
# wave to go healthy before the next. platform/config/edge relies on that, and
# deadlocked once when a certificate was ordered ahead of its issuer.
#
# The platform issues its own certificates from a CA it creates at install time,
# so app teams never see an issuer, a CSR, or a renewal. On a real cluster this
# ClusterIssuer would be ACME against Let's Encrypt or a private PKI; the
# certificate consumers -- the Gateway listener, and any workload that asks --
# do not change when it does.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.1
    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
          keep: false          # this is a demonstration cluster; `make down` should leave nothing
        resources:
          requests: {cpu: 10m, memory: 48Mi}
        webhook:
          resources:
            requests: {cpu: 10m, memory: 32Mi}
        cainjector:
          resources:
            requests: {cpu: 10m, memory: 64Mi}
  destination: {server: https://kubernetes.default.svc, namespace: cert-manager}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
